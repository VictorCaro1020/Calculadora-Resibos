<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Recibos</title>
    <link rel="manifest" href="/Calculadora-Resibos/src/manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%232b6cb0' width='192' height='192'/><text x='50%' y='50%' font-size='120' font-weight='bold' fill='white' text-anchor='middle' dy='.3em'>$</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%232b6cb0' width='192' height='192'/><text x='50%' y='50%' font-size='120' font-weight='bold' fill='white' text-anchor='middle' dy='.3em'>$</text></svg>">
    <meta name="theme-color" content="#2b6cb0">
    <link rel="stylesheet" href="/Calculadora-Resibos/src/style.css">
    <meta name="description" content="Calculadora inteligente para distribuir equitativamente gastos de servicios domésticos entre múltiples unidades">
</head>
<body>
    <div id="app"></div>
    
    <!-- Modular app loaded from src/ -->
    <script src="/Calculadora-Resibos/src/modules/i18n.js"></script>
    <script src="/Calculadora-Resibos/src/modules/storage.js"></script>
    <script src="/Calculadora-Resibos/src/modules/calculator.js"></script>
    <script src="/Calculadora-Resibos/src/modules/ui.js"></script>
    <script src="/Calculadora-Resibos/src/app.js"></script>
    
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/Calculadora-Resibos/src/service-worker.js', { scope: '/Calculadora-Resibos/' })
                .then(() => console.log('✓ Service Worker registrado'))
                .catch(err => console.warn('✗ Error registrando Service Worker:', err));
        }
        
        // Initialize the app
        const app = UtilityCalculatorApp();
        app.initialize();
    </script>
</body>
</html>
